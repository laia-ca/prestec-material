<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous">
    <link rel="stylesheet" href="estilos.css">
    <title>Gestió de prèstecs</title>
</head>

<body>
    <div class="container mt-5">
        <h1 class="mb-4 text-center">Prèstec de material de l'aula</h1>

        <div class="card p-4 mb-4 shadow-sm">
            <div class="mb-3">
                <label for="nomEstudiant" class="form-label">Nom de l'estudiant:</label>
                <input type="text" id="nomEstudiant" class="form-control" placeholder="Ex. Miquel Martínez">
            </div>

            <div class="mb-3">
                <label for="materialSeleccionat" class="form-label">Material:</label>
                <select id="materialSeleccionat" class="form-select">
                    <option value="">Selecciona un material</option>
                    <option value="Carregador">Carregador</option>
                    <option value="Ratolí">Ratolí</option>
                    <option value="Portàtil">Portàtil</option>
                    <option value="Altres">Altres</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Torn:</label>
                <div>
                    <input type="radio" id="tornMati" value="Matí" name="tornPrestec">
                    <label for="tornMati" class="me-3">Matí</label>

                    <input type="radio" id="tornTarda" value="Tarda" name="tornPrestec">
                    <label for="tornTarda">Tarda</label>
                </div>
            </div>

            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="estatRetornat">
                <label class="form-check-label" for="estatRetornat">Material retornat</label>
            </div>

            <div>
                <button id="botoGuardar" class="btn btn-info w-100">Afegir prèstec</button>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-striped table-bordered align-middle text-center">
                <thead class="table-dark">
                    <tr>
                        <th>Estudiant</th>
                        <th>Material</th>
                        <th>Torn</th>
                        <th>Retornat?</th>
                        <th>Accions</th>
                    </tr>
                </thead>
                <tbody id="TaulaPrestecs">
                </tbody>
            </table>
        </div>
    </div>

    <script src="material.js"></script>
</body>

</html>
